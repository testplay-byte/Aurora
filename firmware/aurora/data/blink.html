<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurora — BLINK</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">AURORA</div>
    <div class="tag">blink settings</div>
    <div class="state" id="state">loading…</div>
  </header>

  <div class="card">
    <h2>Timing</h2>
    <div class="row">
      <div><div class="label">Interval</div><div class="sub">ms between phase changes (20–2000)</div></div>
      <input type="range" id="interval" min="20" max="2000" step="10" value="500">
      <div class="value" id="intervalV">500</div>
    </div>
    <div class="row">
      <div><div class="label">No-off cycle</div><div class="sub">cycle colors without ever going dark</div></div>
      <label class="toggle"><input type="checkbox" id="noOff"><span class="track"></span></label>
    </div>
    <div class="row">
      <div><div class="label">Random</div><div class="sub">reserved — palette cycles in order</div></div>
      <label class="toggle"><input type="checkbox" id="random"><span class="track"></span></label>
    </div>
  </div>

  <div class="card">
    <h2>Palette (max 8)</h2>
    <div class="palette" id="pal"></div>
  </div>

  <div class="btn-row">
    <button class="btn primary" id="save">💾 SAVE</button>
    <button class="btn ghost" id="run">▶ RUN</button>
  </div>

  <div style="margin-top:12px"><a class="back" href="/mode.html">← mode settings</a></div>
  <footer>Aurora • ESP32-S3 • v2.0</footer>
</div>

<script src="/app.js"></script>
<script>
(() => {
  const MODE = 2;
  let cfg = null, pal = null;

  const $i = document.getElementById("interval");
  const $iv = document.getElementById("intervalV");
  $i.addEventListener("input", () => { $iv.textContent = $i.value; });

  function collect() {
    return {
      name: "BLINK",
      interval: +$i.value,
      random: document.getElementById("random").checked,
      no_off: document.getElementById("noOff").checked,
      colors: pal.get(),
    };
  }

  document.getElementById("save").addEventListener("click", async () => {
    try {
      await App.patchSettings({ ["MODE_" + MODE]: collect() });
      App.toast("BLINK settings saved ✓");
    } catch (e) { App.toast(String(e.message || e), false); }
  });

  document.getElementById("run").addEventListener("click", async () => {
    try {
      await App.patchSettings({ ["MODE_" + MODE]: collect() });
      await App.post("/api/mode", { mode: MODE });
      App.toast("BLINK running");
    } catch (e) { App.toast(String(e.message || e), false); }
  });

  (async () => {
    try {
      const s = await App.loadSettings();
      cfg = s["MODE_" + MODE] || {};
      $i.value = cfg.interval ?? 500;  $iv.textContent = $i.value;
      document.getElementById("noOff").checked = !!cfg.no_off;
      document.getElementById("random").checked = !!cfg.random;
      pal = App.palette({
        mount: document.getElementById("pal"),
        colors: cfg.colors || [[255,0,0],[0,255,0],[0,0,255],[255,255,0]],
        max: 8,
        onChange: () => {},
      });
      document.getElementById("state").textContent = "editing BLINK (mode 2)";
    } catch (e) {
      document.getElementById("state").textContent = "device unreachable";
      document.getElementById("state").style.color = "var(--danger)";
    }
  })();
})();
</script>
</body>
</html>
