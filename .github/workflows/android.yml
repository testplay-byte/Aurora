name: Android CI

# Builds the Aurora controller APK + runs protocol/settings unit tests.
# No local heavy builds (user rule) — this workflow IS the build.

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    name: Test + assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x android/gradlew

      - name: Unit tests + assemble debug
        working-directory: android
        run: ./gradlew --no-daemon test assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aurora-app-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
